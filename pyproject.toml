[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefing"
version = "0.1.0"
description = "Generación del briefing semanal de economía y geopolítica."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21", "PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest", "responses>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
