# Ajustes generales que no encajan en fuentes/módulos/mercados.
#
# nombre_newsletter se usa en el título de informe.md (render.py) y en el
# asunto del borrador de Buttondown (publish.py, sección 8.7 de
# CLAUDE.md: "{NOMBRE}: {titular}").
nombre_newsletter: "The Macrochip"

# Logo de cabecera del email. Subido una sola vez a Buttondown
# (POST /v1/images, aloja en su S3 y devuelve una URL pública) — no se
# vuelve a subir cada semana porque no cambia; render.py lo referencia
# con un <img width="..."> explícito (ver LOGO_ANCHO_PX en render.py),
# no con la sintaxis Markdown de imagen.
# Fondo transparente (no blanco sólido: se veía como un bloque de color
# distinto al del resto del email) y a alta resolución (1720x456, ~7.8x
# el ancho de visualización real): en una prueba real, algunos clientes
# de correo estiraban la imagen más allá de su tamaño natural y se veía
# pixelada; con más resolución de base y el ancho fijado, no pasa.
# Generado con cairosvg (SVG → PNG directo, transparencia real), no con
# una captura de pantalla a la que se le quita el blanco de fondo a mano:
# ese método anterior también volvía transparente cualquier blanco del
# propio diseño (la "M" tallada en blanco quedaba como un agujero, no
# como blanco opaco — invisible salvo que el fondo detrás fuera blanco
# por pura coincidencia, que es como pasó desapercibido hasta ahora).
logo_url: "https://assets.buttondown.email/images/543450fd-12be-44f2-af01-706df1710fda.png"
